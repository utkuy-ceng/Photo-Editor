name: Build Windows Executable

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allow manual trigger from the Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pywin32 pyinstaller

      - name: Download YOLO model
        run: |
          curl -L https://github.com/ultralytics/assets/releases/download/v0.0.0/yolov8m.pt -o yolov8m.pt

      - name: Create icon
        run: |
          python -c "from PIL import Image, ImageDraw; img = Image.new('RGB', (256, 256), color=(53, 116, 201)); draw = ImageDraw.Draw(img); draw.rectangle([48, 88, 208, 168], fill=(255, 255, 255)); draw.ellipse([98, 98, 158, 158], fill=(53, 116, 201)); img.save('icon.ico')"

      - name: Build executable
        run: |
          python -c "import PyInstaller.__main__; PyInstaller.__main__.run(['--clean', '--onefile', '--windowed', '--icon=icon.ico', '--add-data=yolov8m.pt;.', '--name=PhotoEditor', 'photo_editor_ui.py'])"

      - name: Prepare distribution package
        run: |
          mkdir -p dist/PhotoEditor/input_photos
          mkdir -p dist/PhotoEditor/output_photos
          move dist/PhotoEditor.exe dist/PhotoEditor/
          copy quick_guide_for_users.txt dist/PhotoEditor/

          # Create a README.txt file
          echo Photo Editor > dist/PhotoEditor/README.txt
          echo. >> dist/PhotoEditor/README.txt
          echo This application processes photos for official documents. >> dist/PhotoEditor/README.txt
          echo. >> dist/PhotoEditor/README.txt
          echo 1. Place photos in the 'input_photos' folder >> dist/PhotoEditor/README.txt
          echo 2. Run PhotoEditor.exe >> dist/PhotoEditor/README.txt
          echo 3. Find processed photos in the 'output_photos' folder >> dist/PhotoEditor/README.txt

      - name: Upload executable package
        uses: actions/upload-artifact@v3
        with:
          name: PhotoEditor-Windows
          path: dist/PhotoEditor/

      - name: Create release ZIP
        run: |
          cd dist
          powershell Compress-Archive -Path PhotoEditor -DestinationPath PhotoEditor-Windows.zip

      - name: Upload release ZIP
        uses: actions/upload-artifact@v3
        with:
          name: PhotoEditor-Windows-Zip
          path: dist/PhotoEditor-Windows.zip
